# Chunking Configuration: Small Chunks
# chunk_size=256, overlap_ratio=0.1

chunking:
  strategy: "sentence"  # "sentence", "paragraph", or "token"
  chunk_size: 256
  overlap_ratio: 0.1    # 10% overlap
  overlap_tokens: 25    # approximately 10% of 256

embedding:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  dimension: 384
  device: "cpu"          # "cpu" or "cuda"

index:
  type: "vector_store"   # "vector_store", "faiss", or "simple"
  save_path: "results/runs/{run_id}/index"

metadata:
  description: "Small chunk strategy (256 tokens) for fine-grained retrieval"
  created_by: "RAG-LlamaIndex-Project"
